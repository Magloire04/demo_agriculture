<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Espace conseiller AgriFon</title>
  <meta name="theme-color" content="#006828">
  <link rel="icon" href="icons/icone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/conseiller.js"></script>
</head>
<body>
  <header class="entete">
    <div class="entete-interieur">
      <a class="logo" href="./" aria-label="AgriFon, Ministère de l'Agriculture, de l'Élevage et de la Pêche, République du Bénin">
        <img class="logo-armoiries" src="img/armoiries.png" alt="" width="320" height="283">
        <span class="logo-texte" aria-hidden="true">
          <span class="logo-institution">Ministère de l'Agriculture,<br>de l'Élevage et de la Pêche</span>
          <span class="bande"></span>
          <span class="logo-pays">République du Bénin</span>
        </span>
      </a>
      <span class="etiquette-demo">Démo</span>
    </div>
  </header>

  <main class="large" id="contenu">
    <p class="surtitre">Espace conseiller agricole</p>
    <h1 class="titre-vue">Signalements reçus</h1>
    <p class="consigne" data-etat role="status" aria-live="polite">Chargement…</p>
    <div data-liste></div>
  </main>

  <footer class="pied">
    <p><strong>AgriFon</strong> · démonstration de commande vocale en fongbé</p>
    <span class="bande" aria-hidden="true"></span>
  </footer>
</body>
</html>
